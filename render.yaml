services:
  - type: web
    name: kitsune-v2
    runtime: docker
    repo: https://github.com/Heztamione/Kitsune-V2
    branch: main
    plan: free
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      # Optional: set DATABASE_URL and DATABASE_SSL to use PostgreSQL instead of demo mode.
      # Optional: set TURN_URLS, TURN_USERNAME, and TURN_CREDENTIAL for reliable WebRTC.
